<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer Kick — 3D Body Mesh Viewer</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #0d0d0d; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 18px 24px 10px; }
  h1 { font-size: 1.15rem; letter-spacing: -0.01em; }
  header p { color: #c3c2b7; font-size: 0.85rem; margin-top: 4px; }
  header a { color: #3987e5; text-decoration: none; }
  #stage { width: 100%; height: calc(100vh - 150px); min-height: 420px; display: block; }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 14px; align-items: center;
    padding: 12px 24px; background: rgba(26,26,25,0.92); border-top: 1px solid rgba(255,255,255,0.1);
  }
  button {
    background: #3987e5; color: #fff; border: 0; border-radius: 8px; padding: 8px 18px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  input[type=range] { flex: 1; accent-color: #3987e5; }
  #t { color: #c3c2b7; font-size: 0.85rem; min-width: 88px; text-align: right; font-variant-numeric: tabular-nums; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0d0d; z-index: 5; color: #c3c2b7; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>Soccer Kick — 3D Body Mesh (GVHMR, world frame)</h1>
  <p>Recovered from a single phone clip · drag to orbit, scroll to zoom · <a href="index.html">← full report</a></p>
</header>
<canvas id="stage"></canvas>
<div id="bar">
  <button id="play">Pause</button>
  <input id="seek" type="range" min="0" max="33" value="0" step="1">
  <span id="t">t = 0.00s</span>
</div>
<div id="loading">Loading 34 mesh frames (~13 MB)…</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { PLYLoader } from "three/addons/loaders/PLYLoader.js";

const FRAMES = [0,8,16,24,32,40,48,56,64,71,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256].map(i => `assets/mesh3d/frame_${String(i).padStart(4,"0")}.ply`);
const IDX = [0,8,16,24,32,40,48,56,64,71,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256];
const FPS = 52.642;

const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0e11);
const camera = new THREE.PerspectiveCamera(42, 2, 0.05, 100);
camera.position.set(2.8, 1.6, 3.4);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1a19, 0.9));
const key = new THREE.DirectionalLight(0xfff7e8, 2.2); key.position.set(3, 5, 2); scene.add(key);
const rim = new THREE.DirectionalLight(0x8fb4ff, 1.6); rim.position.set(-3, 3, -3); scene.add(rim);

const grid = new THREE.GridHelper(12, 24, 0x2c2c2a, 0x22221f);
scene.add(grid);

const mat = new THREE.MeshStandardMaterial({ color: 0x6f8fd9, metalness: 0.25, roughness: 0.45 });
const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat);
scene.add(mesh);

const loader = new PLYLoader();
const geos = new Array(FRAMES.length);
let loaded = 0;
await Promise.all(FRAMES.map((u, k) => new Promise((res) =>
  loader.load(u, (g) => { g.computeVertexNormals(); geos[k] = g; loaded++;
    document.getElementById("loading").textContent = `Loading mesh frames… ${loaded}/${FRAMES.length}`; res(); },
    undefined, () => res())
)));
document.getElementById("loading").style.display = "none";

let cur = 0, playing = true, acc = 0, last = performance.now();
const seek = document.getElementById("seek"), tEl = document.getElementById("t");
seek.max = String(FRAMES.length - 1);

function show(k) {
  cur = k;
  if (geos[k]) mesh.geometry = geos[k];
  const c = new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
  controls.target.lerp(new THREE.Vector3(c.x, 0.95, c.z), 0.35);
  seek.value = String(k);
  tEl.textContent = `t = ${(IDX[k] / FPS).toFixed(2)}s`;
}
show(0);

document.getElementById("play").onclick = (e) => {
  playing = !playing; e.target.textContent = playing ? "Pause" : "Play";
};
seek.oninput = () => { playing = false; document.getElementById("play").textContent = "Play"; show(+seek.value); };

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * renderer.getPixelRatio() || canvas.height !== h * renderer.getPixelRatio()) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
}
(function loop(now) {
  requestAnimationFrame(loop);
  resize();
  const dt = (now - last) / 1000; last = now;
  if (playing) {
    acc += dt;
    const step = 8 / FPS;                     // one exported frame ≈ 8 source frames
    while (acc > step) { acc -= step; show((cur + 1) % FRAMES.length); }
  }
  controls.update();
  renderer.render(scene, camera);
})(performance.now());
</script>
</body>
</html>
